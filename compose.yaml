services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: prumo_dev
      POSTGRES_USER: prumo_migrator
      POSTGRES_PASSWORD: ${PRUMO_DB_PASSWORD:?Set PRUMO_DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - prumo_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prumo_migrator -d prumo_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prumo_postgres_data:

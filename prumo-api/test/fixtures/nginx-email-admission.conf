worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx-prumo-lab.pid;

events { worker_connections 128; }

http {
  access_log off;
  client_body_temp_path /tmp/prumo-client-temp;
  proxy_temp_path /tmp/prumo-proxy-temp;
  fastcgi_temp_path /tmp/prumo-fastcgi-temp;
  uwsgi_temp_path /tmp/prumo-uwsgi-temp;
  scgi_temp_path /tmp/prumo-scgi-temp;
  server {
    listen 8080;

    # Express accepts an optional trailing slash and case variants by default.
    location ~* ^/api/auth/(email-verification|email-changes)/?$ {
      if ($request_method != POST) { return 405; }
      auth_request /_email_admit;
      auth_request_set $admission_retry_after $upstream_http_retry_after;
      error_page 403 = @email_limited;
      error_page 500 = @admission_unavailable;
      proxy_intercept_errors off;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Prumo-Client-IP "";
      proxy_pass http://unix:/run/prumo-lab/api.sock:;
    }

    location = /_email_admit {
      internal;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie "";
      proxy_set_header X-Prumo-Client-IP $remote_addr;
      proxy_pass http://unix:/run/prumo-lab/admission.sock:/admit;
    }

    location @email_limited {
      add_header Cache-Control no-store always;
      add_header Retry-After $admission_retry_after always;
      return 429;
    }

    location @admission_unavailable {
      add_header Cache-Control no-store always;
      return 503;
    }

    location /api/ {
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Prumo-Client-IP "";
      proxy_pass http://unix:/run/prumo-lab/api.sock:;
    }
  }
}
